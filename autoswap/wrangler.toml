# Cloudflare Pages project config.
#
# `pages_build_output_dir` is relative to this file, and this file sits in the
# repo's `autoswap/` directory — which is what the project's "Root directory"
# must be set to in the Cloudflare dashboard. The build itself is
# `npm run build` (scripts/gen-config.mjs), which writes front/supabase-config.js
# from the two AUTO_SWAP_* environment variables before the folder is published.
#
# See CLOUDFLARE.md for the full dashboard settings and the DNS cutover.
name = "autoswap"
pages_build_output_dir = "front"
compatibility_date = "2026-08-12"
