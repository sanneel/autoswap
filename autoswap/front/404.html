<!doctype html>
<html lang="ka">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self'; connect-src 'self' https://cloudflareinsights.com; form-action 'self'">
    <meta name="theme-color" content="#f2f6f1">
    <meta name="robots" content="noindex">
    <title>AutoSwap — გვერდი ვერ მოიძებნა</title>
    <link rel="stylesheet" href="/styles.css?v=190">
    <style>
      /* Self-contained: this page must render correctly for a missing asset
         as well as a missing page, so it pulls in no scripts and no fonts
         beyond what styles.css already asks for. */
      .nf {
        display: grid;
        gap: 14px;
        justify-items: center;
        max-width: 520px;
        margin: 0 auto;
        padding: 18vh 20px 20px;
        text-align: center;
      }
      .nf-code {
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.18em;
        color: var(--muted);
      }
      .nf h1 {
        margin: 0;
        font-size: 26px;
        line-height: 1.25;
      }
      .nf p {
        margin: 0;
        color: var(--secondary);
      }
      .nf-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
        margin-top: 6px;
      }
    </style>
  </head>
  <body>
    <main class="nf">
      <span class="nf-code">404</span>
      <h1>ასეთი გვერდი არ არსებობს</h1>
      <p>შესაძლოა ბმული მოძველდა, ან განცხადება უკვე წაშლილია.</p>
      <div class="nf-actions">
        <a class="btn btn-primary" href="/">მთავარ გვერდზე</a>
        <a class="btn btn-light" href="/cars">გაცვლების ნახვა</a>
      </div>
    </main>
  </body>
</html>
